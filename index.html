<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>How Are You Feeling? — QF Space</title>
<meta name="description" content="QF Space, Qiyada 2026: choose a feeling and receive an ayah or du’a.">
<meta name="theme-color" content="#004538">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="How are you feeling?">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/amiri-quran-arabic.woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<div id="stage">
  <!-- Welcome: heading, Ar-Ra'd 28, instruction, feelings -->
  <section id="home" class="view is-active">
    <img class="logo" src="assets/tree.svg" alt="Qatar Foundation">
    <h1 class="heading" data-t="heading"></h1>
    <div class="intro"></div>
    <div class="divider" aria-hidden="true"></div>
    <p class="instruction" data-t="instruction"></p>
    <div class="feelings"></div>
  </section>

  <!-- A feeling's ayah / du'a -->
  <section id="verse" class="view" aria-live="polite">
    <img class="logo small" src="assets/tree.svg" alt="Qatar Foundation">
    <h2 class="v-title"></h2>
    <div class="divider" aria-hidden="true"></div>
    <div class="v-box"><div class="v-body"></div></div>
    <div class="v-actions">
      <button class="btn back" type="button" data-t="back"></button>
      <!-- play / pause for the feeling's audio; hidden when the feeling has none -->
      <button class="audio-btn" type="button" aria-label="Play / Pause" hidden>
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
    </div>
  </section>

  <nav class="lang">
    <a href="?lang=en" data-lang="en" lang="en">EN</a>
    <span class="sep">|</span>
    <a href="?lang=ar" data-lang="ar" lang="ar">ع</a>
  </nav>
</div>

<script src="js/content.js?v=5"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
